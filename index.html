<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NoshU — Choose a venue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary-color: #ff5722;   /* Warm Coral/Orange for buttons & hover */
    --accent-color: #ffb300;    /* Golden yellow for badges & highlights */
    --bg-color: #fafafa;        /* Warm light background */
    --card-bg: #ffffff;         /* Clean white for food item cards */
    --text-dark: #1a1a1a;       /* Crisp charcoal for titles & prices */
    --text-soft: #6b6b6b;
    --status-success: #2e7d32;  /* Green for "Ready" or "In Stock" */
    --line: rgba(26,26,26,0.10);
    --font-display: 'Fredoka', sans-serif;
    --font-body: 'Sora', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    color:var(--text-dark);
    font-family:var(--font-body);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg-color);
    overflow-x:hidden;
  }

  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    padding:24px 28px 6px;
    gap:14px;
    flex-wrap:wrap;
  }
  .header-left{ text-align:left; min-width:0; }
  .logo-row{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .logo-mark{
    width:46px;
    height:64px;
    flex:0 0 auto;
    display:block;
  }
  .brand-stack{ display:flex; flex-direction:column; gap:3px; }
  .logo-word{
    font-family:var(--font-display); font-weight:700; font-size:27px;
    color:var(--text-dark); line-height:1;
  }
  header .tagline{
    font-size:14px;
    color:var(--text-soft);
    margin-top:10px;
    font-weight:500;
  }
  .slogan{
    font-size:14px;
    font-weight:500;
    color:var(--text-soft);
    margin:0;
  }

  .header-right{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:6px;
    flex:0 0 auto;
  }
  .login-btn{
    font-family:var(--font-body);
    font-weight:700;
    font-size:14px;
    color:#fff;
    background:var(--primary-color);
    border:none;
    border-radius:999px;
    padding:11px 22px;
    cursor:pointer;
    transition: background 0.15s ease, transform 0.15s ease;
    box-shadow: 0 4px 12px rgba(255,87,34,0.28);
    min-height:44px;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .login-btn:hover{ background:#e64a19; transform:translateY(-1px); }
  .login-btn:active{ transform:translateY(0); }
  .staff-note{
    font-size:11px;
    color:var(--text-soft);
    font-weight:500;
  }

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 20px 70px;
  }

  .headline{
    text-align:center;
    max-width:520px;
    margin:0 0 42px;
  }
  .headline h1{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(24px, 5vw, 34px);
    margin:0 0 8px;
    line-height:1.18;
    color:var(--text-dark);
  }
  .headline p{
    font-size:15px;
    color:var(--text-soft);
    margin:0;
  }

  .bubble-field{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap:56px;
    flex-wrap:wrap;
    max-width:720px;
  }

  .venue{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    text-decoration:none;
  }

  .blob-wrap{
    position:relative;
    width:160px;
    height:160px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .blob{
    position:absolute;
    inset:0;
    border-radius: 62% 38% 55% 45% / 45% 55% 45% 55%;
    transition: transform 0.32s cubic-bezier(.34,1.56,.64,1), border-radius 0.32s ease;
    opacity:0.16;
  }
  .venue:nth-child(1) .blob{ background: var(--primary-color); }
  .venue:nth-child(2) .blob{ background: var(--accent-color); }
  .venue:nth-child(3) .blob{ background: var(--primary-color); }

  .bubble{
    position:relative;
    width:134px;
    height:134px;
    border-radius:50%;
    background-size:cover;
    background-position:center;
    background-color:var(--card-bg);
    box-shadow: 0 8px 20px rgba(26,26,26,0.16);
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), box-shadow 0.3s ease, border-color 0.3s ease;
    border:4px solid var(--card-bg);
    z-index:1;
  }

  .venue:hover .bubble,
  .venue:focus-visible .bubble{
    transform: scale(1.2);
    box-shadow: 0 16px 30px rgba(255,87,34,0.28);
    border-color: var(--accent-color);
  }
  .venue:hover .blob,
  .venue:focus-visible .blob{
    transform: scale(1.15);
    border-radius: 45% 55% 45% 55% / 55% 45% 55% 45%;
    opacity:0.26;
  }

  .venue:active .bubble{ transform: scale(1.1); }

  .venue-label{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16px;
    color:var(--text-dark);
  }
  .venue-emoji{ margin-right:5px; }

  @media (prefers-reduced-motion: reduce){
    .bubble, .blob{ transition:none; }
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 600px){
    header{ padding:18px 18px 4px; }
    .header-right{ align-items:flex-end; }
    .logo-mark{ width:34px; height:48px; }
    main{ padding:18px 16px 56px; }
    .headline{ margin-bottom:30px; }
    .bubble-field{ gap:30px; }
    .blob-wrap{ width:112px; height:112px; }
    .bubble{ width:94px; height:94px; border-width:3px; }
    .venue-label{ font-size:13.5px; }
  }

  @media (max-width: 360px){
    .bubble-field{ gap:20px; }
    .blob-wrap{ width:96px; height:96px; }
    .bubble{ width:80px; height:80px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo-row">
      <!-- NoshU icon: steaming U bowl -->
      <svg class="logo-mark" viewBox="0 -40 200 280" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 92 45 C 80 32, 104 22, 92 5 C 80 -12, 104 -22, 92 -35" fill="none" stroke="var(--accent-color)" stroke-width="12" stroke-linecap="round"/>
        <path d="M 118 45 C 106 32, 130 22, 118 5 C 106 -12, 130 -22, 118 -35" fill="none" stroke="var(--accent-color)" stroke-width="12" stroke-linecap="round"/>
        <path d="
          M 40 50
          L 40 150
          A 60 60 0 0 0 160 150
          L 160 115
          A 11 11 0 0 0 150 102
          A 11 11 0 0 0 150 82
          A 11 11 0 0 0 160 69
          L 160 50
          A 20 20 0 0 0 120 50
          L 120 150
          A 20 20 0 0 1 80 150
          L 80 50
          A 20 20 0 0 0 40 50 Z
        " fill="var(--primary-color)"/>
        <ellipse cx="100" cy="192" rx="20" ry="3" fill="#cf4327"/>
        <path d="M 82 182 A 18 18 0 0 0 118 182 Z" fill="#cf4327"/>
        <line x1="109" y1="184" x2="123" y2="170" stroke="#cf4327" stroke-width="3.5" stroke-linecap="round"/>
        <ellipse cx="125" cy="168" rx="3.5" ry="5" fill="#cf4327" transform="rotate(35 125 168)"/>
        <path d="M 97 178 C 94 174, 100 171, 97 167" fill="none" stroke="var(--primary-color)" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 103 178 C 100 174, 106 171, 103 167" fill="none" stroke="var(--primary-color)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div class="brand-stack">
        <span class="logo-word">NoshU</span>
        <span class="slogan">Welcomes U</span>
      </div>
    </div>
    <div class="tagline">Pick where you're ordering from</div>
  </div>
  <div class="header-right">
    <a href="login.html" class="login-btn">Log in</a>
    <span class="staff-note">(for staff only)</span>
  </div>
</header>

<main>
  <div class="headline">
    <h1>Hungry? Tap a spot to start your order.</h1>
    <p>Fresh from campus kitchens, ready when you are.</p>
  </div>

  <div class="bubble-field">
    <a class="venue" href="wow_fries.html" data-venue="Wow Fries">
      <div class="blob-wrap">
        <div class="blob"></div>
        <div class="bubble" style="background-image:url('https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?w=400&q=60')"></div>
      </div>
      <span class="venue-label"><span class="venue-emoji">🍟</span>Wow Fries</span>
    </a>

    <a class="venue" href="main_cafeteria.html" data-venue="Main Cafeteria">
      <div class="blob-wrap">
        <div class="blob"></div>
        <div class="bubble" style="background-image:url('https://images.unsplash.com/photo-1567234669003-dce7a7a88821?w=400&q=60')"></div>
      </div>
      <span class="venue-label"><span class="venue-emoji">🍱</span>Main Cafeteria</span>
    </a>

    <a class="venue" href="ark.html" data-venue="ARK">
      <div class="blob-wrap">
        <div class="blob"></div>
        <div class="bubble" style="background-image:url('https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=400&q=60')"></div>
      </div>
      <span class="venue-label"><span class="venue-emoji">🍛</span>ARK</span>
    </a>
  </div>
</main>

</body>
</html>
