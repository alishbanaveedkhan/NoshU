<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NoshU — Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary-color: #ff5722;
    --accent-color: #ffb300;
    --bg-color: #fafafa;
    --card-bg: #ffffff;
    --text-dark: #1a1a1a;
    --text-soft: #6b6b6b;
    --status-success: #2e7d32;
    --line: rgba(26,26,26,0.10);
    --font-display: 'Fredoka', sans-serif;
    --font-body: 'Sora', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-color);
    color:var(--text-dark);
    font-family:var(--font-body);
    min-height:100vh;
    min-height:100dvh;
    padding-bottom:90px;
  }
  button{ font-family:inherit; cursor:pointer; }
  a{ color:inherit; text-decoration:none; }

  header.topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:14px;
    padding:12px 20px;
    background:var(--card-bg);
    border-bottom:1px solid var(--line);
  }
  .hamburger{
    display:flex; flex-direction:column; justify-content:center; gap:4px;
    width:40px; height:40px;
    border:none; background:transparent;
    border-radius:10px;
    flex:0 0 auto;
  }
  .hamburger:hover{ background:rgba(26,26,26,0.06); }
  .hamburger span{
    display:block; width:20px; height:2.5px; margin:0 auto;
    background:var(--text-dark); border-radius:2px;
  }
  .logo-row{ display:flex; align-items:center; gap:8px; }
  .logo-mark{ width:32px; height:44px; flex:0 0 auto; display:block; }
  .logo-word{
    font-family:var(--font-display); font-weight:700; font-size:19px;
    color:var(--text-dark);
  }

  .hero{
    position:relative;
    height:220px;
    display:flex; align-items:center; justify-content:center;
    background-size:cover; background-position:center;
    overflow:hidden;
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(26,26,26,0.35), rgba(26,26,26,0.68));
  }
  .hero-inner{ position:relative; z-index:1; text-align:center; padding:0 20px; }
  .hero-eyebrow{
    color:rgba(255,255,255,0.82); font-size:13px; font-weight:600;
    letter-spacing:0.05em; text-transform:uppercase; margin-bottom:6px;
  }
  .hero-title{
    font-family:var(--font-display); font-weight:600;
    font-size:clamp(28px, 6vw, 42px);
    color:#fff; margin:0;
  }

  .drawer-overlay{
    position:fixed; inset:0; background:rgba(26,26,26,0.4);
    z-index:90; opacity:0; pointer-events:none;
    transition: opacity 0.25s ease;
  }
  .drawer-overlay.open{ opacity:1; pointer-events:auto; }

  .drawer{
    position:fixed; top:0; bottom:0; left:0;
    width:280px; max-width:82vw;
    background:var(--card-bg);
    z-index:95;
    padding:20px 22px 24px;
    transform:translateX(-100%);
    transition: transform 0.28s ease;
    display:flex; flex-direction:column; gap:18px;
    box-shadow: 8px 0 24px rgba(26,26,26,0.12);
  }
  .drawer.open{ transform:translateX(0); }

  .drawer-head{ display:flex; align-items:center; justify-content:space-between; }
  .drawer-head h2{ font-family:var(--font-display); font-size:18px; margin:0; font-weight:600; }
  .drawer-close{
    border:none; background:transparent; font-size:18px; color:var(--text-soft);
    width:32px; height:32px; border-radius:8px;
  }
  .drawer-close:hover{ background:rgba(26,26,26,0.06); }

  .filter-list{ display:flex; flex-direction:column; gap:4px; }
  .filter-item{
    display:flex; align-items:center; gap:10px;
    padding:10px 8px; border-radius:8px; cursor:pointer;
    font-size:14.5px; font-weight:500;
  }
  .filter-item:hover{ background:rgba(255,87,34,0.07); }
  .filter-item input[type="checkbox"]{
    width:18px; height:18px; accent-color:var(--primary-color);
    flex:0 0 auto;
  }

  main{ max-width:1100px; margin:0 auto; padding:24px 20px 20px; }

  .active-filters{
    display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;
  }
  .chip{
    font-size:12.5px; font-weight:600; color:var(--primary-color);
    background:rgba(255,87,34,0.10);
    border:1px solid rgba(255,87,34,0.25);
    border-radius:999px; padding:5px 12px;
  }

  .menu-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap:18px;
  }

  .item-card{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 2px 6px rgba(26,26,26,0.05);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }
  .item-card:hover{ box-shadow:0 10px 22px rgba(26,26,26,0.10); transform:translateY(-2px); }

  .item-img-wrap{
    width:100%; aspect-ratio:1/1;
    background-size:cover; background-position:center;
    background-color:#eee;
    position:relative;
  }
  .item-tag{
    position:absolute; top:8px; left:8px;
    font-size:10.5px; font-weight:700;
    letter-spacing:0.02em;
    padding:4px 9px;
    border-radius:999px;
    text-transform:uppercase;
  }
  .item-tag.meals{ background:rgba(255,87,34,0.14); color:var(--primary-color); }
  .item-tag.drinks{ background:rgba(255,179,0,0.20); color:#8a6100; }
  .item-tag.snacks{ background:rgba(46,125,50,0.14); color:var(--status-success); }

  .item-unavailable-badge{
    position:absolute; top:8px; right:8px;
    background:rgba(26,26,26,0.75); color:#fff;
    font-size:10px; font-weight:700; letter-spacing:0.02em;
    padding:4px 8px; border-radius:999px; text-transform:uppercase;
  }

  .item-card.unavailable{ opacity:0.55; }
  .item-card.unavailable .item-img-wrap{ filter:grayscale(0.4); }

  .item-comment{
    font-size:12px; font-weight:600; color:#c62828;
    line-height:1.35;
  }

  .item-body{ padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .item-name{ font-size:14.5px; font-weight:600; line-height:1.3; min-height:2.5em; }
  .item-price{ font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--text-dark); }

  .qty-stepper{
    margin-top:auto;
    display:flex; align-items:center; justify-content:space-between;
    gap:8px;
  }
  .qty-btn{
    width:32px; height:32px; border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--card-bg);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:600; line-height:1;
    color:var(--text-dark);
    transition: all 0.15s ease;
  }
  .qty-btn.minus:disabled{
    opacity:0.35; cursor:not-allowed;
    border-color:var(--line); color:var(--text-soft);
  }
  .qty-btn.minus:not(:disabled){
    border-color:var(--primary-color); color:var(--primary-color);
  }
  .qty-btn.minus:not(:disabled):hover{ background:rgba(255,87,34,0.08); }

  .qty-btn.plus{
    border-color:var(--line);
    background:var(--card-bg);
  }
  .item-card:hover .qty-btn.plus,
  .qty-btn.plus:focus-visible{
    border-color:var(--primary-color);
    color:var(--primary-color);
  }
  .qty-btn.plus:hover{
    background:var(--primary-color);
    border-color:var(--primary-color);
    color:#fff;
    transform:scale(1.06);
  }

  .qty-value{
    font-size:14px; font-weight:700; min-width:18px; text-align:center;
  }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-soft); font-size:14px;
  }

  .cart-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:var(--text-dark);
    color:#fff;
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    gap:14px;
    transform:translateY(110%);
    transition: transform 0.28s cubic-bezier(.34,1.2,.64,1);
    box-shadow: 0 -6px 20px rgba(26,26,26,0.18);
  }
  .cart-bar.visible{ transform:translateY(0); }
  .cart-bar-left{ display:flex; align-items:center; gap:10px; min-width:0; }
  .cart-bar-count{
    background:var(--primary-color); color:#fff;
    border-radius:50%; width:26px; height:26px;
    display:flex; align-items:center; justify-content:center;
    font-size:12.5px; font-weight:700; flex:0 0 auto;
  }
  .cart-bar-total{ font-size:14.5px; font-weight:600; }
  .cart-bar-sub{ font-size:11.5px; color:rgba(255,255,255,0.65); }
  .view-cart-btn{
    background:var(--primary-color); color:#fff; border:none;
    border-radius:999px; padding:10px 20px; font-size:14px; font-weight:700;
    flex:0 0 auto;
  }
  .view-cart-btn:hover{ background:#e64a19; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(26,26,26,0.45);
    z-index:110; display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
  }
  .modal-overlay.visible{ opacity:1; pointer-events:auto; }
  @media (min-width:600px){ .modal-overlay{ align-items:center; } }

  .cart-modal{
    background:var(--card-bg);
    width:100%; max-width:420px;
    border-radius:18px 18px 0 0;
    padding:22px 22px 26px;
    max-height:80vh; overflow-y:auto;
    transform:translateY(16px);
    transition: transform 0.25s ease;
  }
  .modal-overlay.visible .cart-modal{ transform:translateY(0); }
  @media (min-width:600px){ .cart-modal{ border-radius:18px; } }

  .cart-modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cart-modal-head h2{ font-family:var(--font-display); font-size:18px; margin:0; font-weight:600; }
  .cart-modal-close{ border:none; background:transparent; font-size:18px; color:var(--text-soft); width:32px; height:32px; border-radius:8px; }
  .cart-modal-close:hover{ background:rgba(26,26,26,0.06); }

  .cart-row{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .cart-row-name{ flex:1; min-width:0; font-size:14px; font-weight:600; }
  .cart-row-price{ font-size:12.5px; color:var(--text-soft); }
  .cart-row-total{ font-size:14px; font-weight:700; min-width:64px; text-align:right; }

  .cart-modal-total{
    display:flex; justify-content:space-between; align-items:baseline;
    padding-top:14px; margin-top:6px; border-top:1.5px solid var(--text-dark);
  }
  .cart-modal-total .label{ font-size:13px; color:var(--text-soft); }
  .cart-modal-total .amount{ font-family:var(--font-display); font-size:20px; font-weight:700; }

  .checkout-btn{
    width:100%; margin-top:16px;
    background:var(--primary-color); color:#fff; border:none;
    border-radius:10px; padding:14px; font-size:15px; font-weight:700;
  }
  .checkout-btn:hover{ background:#e64a19; }

  @media (max-width:600px){
    .hero{ height:180px; }
    .menu-grid{ grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
    .item-name{ font-size:13.5px; min-height:2.4em; }
  }

  .active-order-banner{
    display:none;
    align-items:center; justify-content:space-between; gap:10px;
    background:#1a1a1a; color:#fff;
    padding:10px 20px;
    font-size:13.5px;
  }
  .active-order-banner .code{
    font-family:var(--font-display); font-weight:700; color:var(--accent-color);
  }
  .active-order-banner .view-link-select{
    background:var(--primary-color); color:#fff;
    border-radius:999px; padding:7px 30px 7px 14px; font-size:12.5px; font-weight:700;
    flex:0 0 auto; border:none; cursor:pointer;
    appearance:none; -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M7 10l5 5 5-5z'/></svg>");
    background-repeat:no-repeat; background-position:right 8px center; background-size:16px;
  }
  .active-order-banner .view-link-select:hover{ background-color:#e64a19; }
  .active-order-banner .view-link-select option{ color:var(--text-dark); }
</style>
</head>

const CATEGORY_LABELS = { meals: "Meals", drinks: "Drinks", snacks: "Snacks" };

function getVenueKey() {
  const params = new URLSearchParams(window.location.search);
  const v = (params.get("venue") || "").toLowerCase().replace(/[^a-z]/g, "");
  return VENUES[v] ? v : "wowfries";
}

const venueKey = getVenueKey();
const venue = VENUES[venueKey];

let activeCategories = new Set(["all"]);
let cart = {};
let itemStateMap = {}; // { item_id: { out_of_stock, comment } } — from Supabase

function getCartArray() {
  return Object.entries(cart)
    .filter(([, qty]) => qty > 0)
    .map(([id, qty]) => {
      const item = venue.items.find(i => i.id === id);
      return { id, name: item.name, price: item.price, category: item.category, qty };
    });
}
function cartTotal() { return getCartArray().reduce((sum, i) => sum + i.price * i.qty, 0); }
function cartCount() { return getCartArray().reduce((sum, i) => sum + i.qty, 0); }

function persistCart() {
  try {
    sessionStorage.setItem("noshu_cart", JSON.stringify({
      venue: venueKey,
      venueName: venue.name,
      items: getCartArray(),
      total: cartTotal()
    }));
  } catch (e) {}
}

document.getElementById("hero").style.backgroundImage = `url('${venue.hero}')`;
document.getElementById("heroTitle").textContent = venue.name;
document.title = `NoshU — ${venue.name}`;

function renderFilterList() {
  const list = document.getElementById("filterList");
  list.innerHTML = "";

  const allLabel = document.createElement("label");
  allLabel.className = "filter-item";
  allLabel.innerHTML = `<input type="checkbox" value="all" checked> All`;
  list.appendChild(allLabel);

  venue.categories.forEach(cat => {
    const label = document.createElement("label");
    label.className = "filter-item";
    label.innerHTML = `<input type="checkbox" value="${cat}"> ${CATEGORY_LABELS[cat]}`;
    list.appendChild(label);
  });

  list.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    cb.addEventListener("change", () => onFilterChange(cb));
  });
}

function onFilterChange(changedCb) {
  const allCb = document.querySelector('#filterList input[value="all"]');
  const catCbs = [...document.querySelectorAll('#filterList input:not([value="all"])')];

  if (changedCb.value === "all") {
    if (changedCb.checked) {
      catCbs.forEach(cb => cb.checked = false);
      activeCategories = new Set(["all"]);
    } else {
      changedCb.checked = true;
    }
  } else {
    allCb.checked = false;
    const checked = catCbs.filter(cb => cb.checked).map(cb => cb.value);
    if (checked.length === 0) {
      allCb.checked = true;
      activeCategories = new Set(["all"]);
    } else {
      activeCategories = new Set(checked);
    }
  }
  renderActiveChips();
  renderMenu();
}

function renderActiveChips() {
  const wrap = document.getElementById("activeFilters");
  wrap.innerHTML = "";
  if (activeCategories.has("all")) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = "All items";
    wrap.appendChild(chip);
    return;
  }
  activeCategories.forEach(cat => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = CATEGORY_LABELS[cat];
    wrap.appendChild(chip);
  });
}

const drawer = document.getElementById("drawer");
const drawerOverlay = document.getElementById("drawerOverlay");
function openDrawer() { drawer.classList.add("open"); drawerOverlay.classList.add("open"); }
function closeDrawer() { drawer.classList.remove("open"); drawerOverlay.classList.remove("open"); }
document.getElementById("drawerToggle").addEventListener("click", openDrawer);
document.getElementById("drawerClose").addEventListener("click", closeDrawer);
drawerOverlay.addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

function visibleItems() {
  if (activeCategories.has("all")) return venue.items;
  return venue.items.filter(i => activeCategories.has(i.category));
}

/* ---------------------------------------------------------
   ITEM AVAILABILITY (out-of-stock / comment) — from Supabase
   Loaded once, then kept live via a realtime subscription
   filtered to this venue's rows in "item_state".
   --------------------------------------------------------- */
async function loadItemState() {
  const { data, error } = await db
    .from("item_state")
    .select("item_id, out_of_stock, comment")
    .eq("venue", venueKey);
  if (error) { console.error(error); return; }
  itemStateMap = {};
  (data || []).forEach(row => {
    itemStateMap[row.item_id] = { out_of_stock: row.out_of_stock, comment: row.comment };
  });
  renderMenu();
}

db.channel("item_state_" + venueKey)
  .on("postgres_changes",
    { event: "*", schema: "public", table: "item_state", filter: `venue=eq.${venueKey}` },
    () => loadItemState()
  )
  .subscribe();

function renderMenu() {
  const grid = document.getElementById("menuGrid");
  grid.innerHTML = "";
  const items = visibleItems();

  if (items.length === 0) {
    grid.innerHTML = `<div class="empty-state">No items in this category yet.</div>`;
    return;
  }

  items.forEach(item => {
    const qty = cart[item.id] || 0;
    const state = itemStateMap[item.id] || {};
    const isUnavailable = !!state.out_of_stock || !!(state.comment && state.comment.trim());
    const card = document.createElement("div");
    card.className = "item-card" + (isUnavailable ? " unavailable" : "");
    card.innerHTML = `
      <div class="item-img-wrap" style="background-image:url('${item.img}')">
        <span class="item-tag ${item.category}">${CATEGORY_LABELS[item.category]}</span>
        ${isUnavailable ? `<span class="item-unavailable-badge">Unavailable</span>` : ""}
      </div>
      <div class="item-body">
        <span class="item-name">${item.name}</span>
        ${state.comment && state.comment.trim() ? `<span class="item-comment">${state.comment.trim()}</span>` : ""}
        <span class="item-price">Rs. ${item.price}</span>
        <div class="qty-stepper">
          <button type="button" class="qty-btn minus" ${(qty === 0 || isUnavailable) ? "disabled" : ""} aria-label="Decrease quantity">−</button>
          <span class="qty-value">${qty}</span>
          <button type="button" class="qty-btn plus" ${isUnavailable ? "disabled" : ""} aria-label="Increase quantity">+</button>
        </div>
      </div>
    `;
    card.querySelector(".plus").addEventListener("click", () => { if (!isUnavailable) changeQty(item.id, 1); });
    card.querySelector(".minus").addEventListener("click", () => { if (!isUnavailable) changeQty(item.id, -1); });
    grid.appendChild(card);
  });
}

function changeQty(id, delta) {
  const next = Math.max(0, (cart[id] || 0) + delta);
  if (next === 0) delete cart[id]; else cart[id] = next;
  renderMenu();
  renderCartBar();
  persistCart();
}

function renderCartBar() {
  const count = cartCount();
  const bar = document.getElementById("cartBar");
  bar.classList.toggle("visible", count > 0);
  document.getElementById("cartBarCount").textContent = count;
  document.getElementById("cartBarTotal").textContent = `Rs. ${cartTotal()}`;
}

const cartModalOverlay = document.getElementById("cartModalOverlay");
function openCartModal() {
  const list = document.getElementById("cartModalList");
  const items = getCartArray();
  list.innerHTML = items.length
    ? ""
    : `<div class="empty-state" style="padding:24px 0;">Your cart is empty.</div>`;
  items.forEach(item => {
    const row = document.createElement("div");
    row.className = "cart-row";
    row.innerHTML = `
      <div style="flex:1; min-width:0;">
        <div class="cart-row-name">${item.name} × ${item.qty}</div>
        <div class="cart-row-price">Rs. ${item.price} each</div>
      </div>
      <div class="cart-row-total">Rs. ${item.price * item.qty}</div>
    `;
    list.appendChild(row);
  });
  document.getElementById("cartModalAmount").textContent = `Rs. ${cartTotal()}`;
  cartModalOverlay.classList.add("visible");
}
function closeCartModal() { cartModalOverlay.classList.remove("visible"); }

document.getElementById("viewCartBtn").addEventListener("click", openCartModal);
document.getElementById("cartModalClose").addEventListener("click", closeCartModal);
cartModalOverlay.addEventListener("click", e => { if (e.target === cartModalOverlay) closeCartModal(); });

document.getElementById("checkoutBtn").addEventListener("click", () => {
  persistCart();
  window.location.href = `checkout.html?venue=${venueKey}`;
});

/* ---------------------------------------------------------
   "MY ORDERS" — this student's own order ids, kept in
   localStorage since there's no student login. The rows
   themselves live in Supabase, so any device that has the
   id can look the order up.
   --------------------------------------------------------- */
function getMyOrderIds() {
  try { return JSON.parse(localStorage.getItem("noshu_my_order_ids") || "[]"); }
  catch (e) { return []; }
}
function saveMyOrderIds(ids) {
  try { localStorage.setItem("noshu_my_order_ids", JSON.stringify(ids)); } catch (e) {}
}

async function checkActiveOrderBanner() {
  const ids = getMyOrderIds();
  if (ids.length === 0) {
    document.getElementById("activeOrderBanner").style.display = "none";
    return;
  }

  const { data, error } = await db
    .from("Orders")
    .select("id, display_code, venue_name, total, status")
    .in("id", ids)
    .neq("status", "Delivered")
    .order("created_at", { ascending: false });

  if (error) { console.error(error); return; }

  // If an order was removed/delivered server-side, drop it locally too.
  const stillValidIds = (data || []).map(o => o.id);
  if (stillValidIds.length !== ids.length) saveMyOrderIds(stillValidIds);

  if (!data || data.length === 0) {
    document.getElementById("activeOrderBanner").style.display = "none";
    return;
  }

  document.getElementById("activeOrderText").textContent =
    data.length > 1 ? `You have ${data.length} orders in progress` : `Order in progress`;

  const select = document.getElementById("activeOrderSelect");
  select.innerHTML = `<option value="" disabled selected>View receipts</option>`;
  data.forEach(order => {
    const opt = document.createElement("option");
    opt.value = order.id;
    opt.textContent = `${order.venue_name} · #${order.display_code} · Rs. ${order.total}`;
    select.appendChild(opt);
  });

  document.getElementById("activeOrderBanner").style.display = "flex";
}

document.getElementById("activeOrderSelect").addEventListener("change", (e) => {
  const orderId = e.target.value;
  if (orderId) window.location.href = `checkout.html?order=${orderId}`;
});

/* ---------------------------------------------------------
   INIT
   --------------------------------------------------------- */
renderFilterList();
renderActiveChips();
renderCartBar();
loadItemState();
checkActiveOrderBanner();
setInterval(checkActiveOrderBanner, 5000);
</script>
